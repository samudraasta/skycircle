<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Presensi Chat - Sky Circle</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #efeae2; /* WA web bg color */
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .chat-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .chat-header {
            background: #008069; /* WA web header color */
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            z-index: 10;
        }
        .mentor-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #008069;
            font-weight: bold;
            font-size: 18px;
        }
        .mentor-info {
            flex-grow: 1;
        }
        .mentor-name {
            font-weight: 600;
            font-size: 16px;
            display: block;
        }
        .mentor-status {
            font-size: 12px;
            opacity: 0.8;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }
        .chat-body {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }
        .msg-ai {
            align-self: flex-start;
            background: white;
            border-top-left-radius: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .msg-mentor {
            align-self: flex-end;
            background: #d9fdd3;
            border-top-right-radius: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .msg-time {
            font-size: 10px;
            color: #667781;
            float: right;
            margin-top: 4px;
            margin-left: 12px;
        }
        .chat-footer {
            background: #f0f2f5;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .chat-input {
            flex-grow: 1;
            padding: 14px 20px;
            border-radius: 24px;
            outline: none;
            font-size: 16px;
            background: white;
            overflow-y: auto;
            max-height: 100px;
            line-height: 20px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .chat-input:empty:before {
            content: attr(data-placeholder);
            color: #999;
            pointer-events: none;
        }
        .send-btn {
            background: #00a884;
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover {
            background: #008f6f;
        }
        .send-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        /* Typing Indicator */
        .typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 12px;
            align-self: flex-start;
            margin-bottom: 12px;
        }
        .typing.active {
            display: flex;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="mentor-avatar" id="avatar-initial">A</div>
            <div class="mentor-info">
                <span class="mentor-name" id="display-name">Memuat...</span>
                <span class="mentor-status">Asisten Presensi AI - Online</span>
            </div>
            <a href="#" id="logout-btn" class="logout-btn" title="Keluar"><i class="fas fa-sign-out-alt"></i></a>
        </div>

        <!-- Chat Area -->
        <div class="chat-body" id="chat-box">
            <div class="message msg-ai">
                Halo Kak <strong id="welcome-name">Mentor</strong>! 👋<br>
                Saya adalah Kak Ukhti, Asisten Presensi Sky Circle.<br><br>
                Silakan ketik laporan kehadiran hari ini. (Contoh: "P1. Bima, Farid hadir").
                <span class="msg-time" id="welcome-time">10:00</span>
            </div>
            
            <div class="typing" id="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-footer">
            <div id="chat-input" class="chat-input" contenteditable="true" data-placeholder="Ketik pesan laporan presensi..." spellcheck="false"></div>
            <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Script Logic -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../js/mentor-chat.js?v=2"></script>
</body>
</html>
