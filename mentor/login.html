<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Login - Sky Circle</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-body);
            margin: 0;
            flex-direction: column;
        }
        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo-icon {
            margin: 0 auto 20px;
        }
        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 16px;
            display: none;
            padding: 10px;
            background: #fee2e2;
            border-radius: 8px;
        }
        .back-link {
            margin-top: 24px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon"><div></div><div></div><div></div><div></div></div>
        <h2 style="margin-bottom: 8px;">Login Mentor</h2>
        <p style="color: var(--text-muted); margin-bottom: 32px; font-size: 14px;">Masuk menggunakan akun Google Anda yang terdaftar di sistem Sky Circle.</p>
        
        <!-- Google Sign-In Button Container -->
        <div id="g_id_onload"
             data-client_id="ISI_DENGAN_GOOGLE_CLIENT_ID_KAKAK.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left"
             style="display: flex; justify-content: center;">
        </div>

        <div id="error-message" class="error-msg">
            Email tidak terdaftar sebagai Mentor. Hubungi Admin.
        </div>

        <a href="../index.html" class="back-link">&larr; Kembali ke Portal Utama</a>
        
        <br><br>
        <button onclick="skipLogin()" style="background: none; border: 1px dashed var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500;">
            Lihat Tampilan Chat (Mode Demo)
        </button>
    </div>

    <!-- JWT Decoder -->
    <script>
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            const userEmail = data.email;
            const userName = data.name;
            const userPicture = data.picture;

            // Simpan sementara di Session Storage (belum tervalidasi)
            sessionStorage.setItem('temp_mentor_email', userEmail);
            sessionStorage.setItem('temp_mentor_name', userName);
            sessionStorage.setItem('temp_mentor_pic', userPicture);

            // Karena kita butuh validasi ke Spreadsheet, kita akan lakukan validasi di dashboard.html
            // Atau bisa di sini jika Apps Script sudah disetup.
            // Untuk flow termudah: kita lempar ke dashboard, dashboard yang mengecek.
            
            // Simpan token login (simulasi)
            localStorage.setItem('mentor_logged_in', 'true');
            localStorage.setItem('mentor_email', userEmail);
            localStorage.setItem('mentor_name', userName);
            
            // Redirect ke Chat Dashboard
            window.location.href = 'dashboard.html';
        }

        // Fungsi bypass untuk Demo Mode
        function skipLogin() {
            localStorage.setItem('mentor_logged_in', 'true');
            localStorage.setItem('mentor_name', 'Kak Teguh (Demo)');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
